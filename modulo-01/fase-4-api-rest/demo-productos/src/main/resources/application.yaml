spring:
  application:
    name: tienda-online
  profiles:
    # Perfil por defecto al arrancar desde el IDE. En producción se sobrescribe con
    # la variable de entorno SPRING_PROFILES_ACTIVE=prod.
    active: dev

# Propiedades propias de la tienda: se leen con TiendaProperties.
tienda:
  nombre: Tienda Online
  moneda: EUR
  # Entre comillas: sin ellas YAML lo lee como double (50.0) y se pierde la escala del BigDecimal.
  envio-gratis-desde: "50.00"
